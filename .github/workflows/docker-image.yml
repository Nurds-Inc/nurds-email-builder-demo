name: Build Email Builder Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docker-image.yml
      - Dockerfile
      - nginx.conf
      - package.json
      - pnpm-lock.yaml
      - src/**

permissions:
  contents: read
  packages: write

concurrency:
  group: nurds-email-builder-image-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64
          tags: |
            ghcr.io/nurds-inc/nurds-email-builder-demo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
